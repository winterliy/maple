name: Maple
version: '${version}'
main: dev.ledge.maple.MaplePlugin
api-version: '1.13'
description: Image plugin for GLAP1-compatible servers.
commands:
  image:
    description: Manage images from the server plugins/images folder.
    usage: /image <load|set|del|reload|cancel>
    permission: maple.admin
permissions:
  maple.admin:
    description: Allows managing Maple image maps.
    default: op
